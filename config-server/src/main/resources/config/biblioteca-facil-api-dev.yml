server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/biblioteca_facil}
    username: ${SPRING_DATASOURCE_USERNAME:biblioteca}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:biblioteca}
    password: ${RABBITMQ_PASSWORD:}

servicos:
  consulta-isbn:
    url: ${CONSULTA_ISBN_URL:http://localhost:8081}

spring.cloud.openfeign.client.config.consultaIsbnClient:
  connectTimeout: ${CONSULTA_ISBN_CONNECT_TIMEOUT:3000}
  readTimeout: ${CONSULTA_ISBN_READ_TIMEOUT:5000}

resiliencia:
  consulta-isbn:
    max-tentativas: ${CONSULTA_ISBN_MAX_TENTATIVAS:3}
    intervalo-ms: ${CONSULTA_ISBN_INTERVALO_RETRY_MS:250}

mensageria:
  publicacao-habilitada: true
  exchange: ${RESERVAS_EXCHANGE:biblioteca.reservas}
  filas:
    reserva-solicitada: ${RESERVA_SOLICITADA_QUEUE:biblioteca.reserva-solicitada}
  routing-keys:
    reserva-solicitada: ${RESERVA_SOLICITADA_ROUTING_KEY:reserva.solicitada}

batch:
  importacao-livros:
    arquivo: ${IMPORTACAO_LIVROS_ARQUIVO:./dados/livros.csv}
    tamanho-chunk: ${IMPORTACAO_LIVROS_CHUNK:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
