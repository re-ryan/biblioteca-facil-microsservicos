services:
  - type: web
    name: biblioteca-facil-api-26e4
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./biblioteca-facil-api/Dockerfile
    dockerContext: ./biblioteca-facil-api
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: CONFIG_IMPORT
        value: optional:classpath:/render/
      - key: DB_HOST
        fromDatabase:
          name: biblioteca-facil-db-26e4
          property: host
      - key: DB_PORT
        fromDatabase:
          name: biblioteca-facil-db-26e4
          property: port
      - key: DB_NAME
        fromDatabase:
          name: biblioteca-facil-db-26e4
          property: database
      - key: DB_USER
        fromDatabase:
          name: biblioteca-facil-db-26e4
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: biblioteca-facil-db-26e4
          property: password
      - key: CONSULTA_ISBN_URL
        value: https://biblioteca-facil-isbn-26e4.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://biblioteca-facil-frontend-26e4.onrender.com

  - type: web
    name: biblioteca-facil-isbn-26e4
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./consulta-isbn-service/Dockerfile
    dockerContext: ./consulta-isbn-service
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: CONFIG_IMPORT
        value: optional:classpath:/render/
      - key: CORS_ALLOWED_ORIGINS
        value: https://biblioteca-facil-frontend-26e4.onrender.com

  - type: web
    name: biblioteca-facil-frontend-26e4
    runtime: static
    repo: https://github.com/re-ryan/biblioteca-facil-frontend.git
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BOOKS_API_URL
        value: https://biblioteca-facil-api-26e4.onrender.com/api/livros
      - key: VITE_CATALOG_API_URL
        value: https://biblioteca-facil-api-26e4.onrender.com/api/catalogo
      - key: VITE_LIBRARIES_API_URL
        value: https://biblioteca-facil-api-26e4.onrender.com/api/bibliotecas
      - key: VITE_ISBN_API_URL
        value: https://biblioteca-facil-isbn-26e4.onrender.com/api/isbn
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: biblioteca-facil-db-26e4
    plan: free
    region: oregon
    databaseName: biblioteca_facil
    user: biblioteca
    postgresMajorVersion: "17"
