services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca_facil}
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  config-server:
    build:
      context: ./config-server
    environment:
      SERVER_PORT: 8888
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  consulta-isbn-service:
    build:
      context: ./consulta-isbn-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      BRASIL_API_URL: ${BRASIL_API_URL:-https://brasilapi.com.br}
      BRASIL_API_CONNECT_TIMEOUT: ${BRASIL_API_CONNECT_TIMEOUT:-3000}
      BRASIL_API_READ_TIMEOUT: ${BRASIL_API_READ_TIMEOUT:-5000}
      BRASIL_API_MAX_TENTATIVAS: ${BRASIL_API_MAX_TENTATIVAS:-3}
      BRASIL_API_INTERVALO_RETRY_MS: ${BRASIL_API_INTERVALO_RETRY_MS:-250}
    ports:
      - "${CONSULTA_ISBN_PORT:-8081}:8081"
    depends_on:
      config-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  biblioteca-facil-api:
    build:
      context: ./biblioteca-facil-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-biblioteca_facil}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-biblioteca}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      CONSULTA_ISBN_URL: http://consulta-isbn-service:8081
      CONSULTA_ISBN_CONNECT_TIMEOUT: ${CONSULTA_ISBN_CONNECT_TIMEOUT:-3000}
      CONSULTA_ISBN_READ_TIMEOUT: ${CONSULTA_ISBN_READ_TIMEOUT:-5000}
      CONSULTA_ISBN_MAX_TENTATIVAS: ${CONSULTA_ISBN_MAX_TENTATIVAS:-3}
      CONSULTA_ISBN_INTERVALO_RETRY_MS: ${CONSULTA_ISBN_INTERVALO_RETRY_MS:-250}
    ports:
      - "${BIBLIOTECA_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      config-server:
        condition: service_healthy
        restart: true
      consulta-isbn-service:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
