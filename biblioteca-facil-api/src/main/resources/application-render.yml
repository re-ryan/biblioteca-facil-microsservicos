server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca_facil}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  rabbitmq:
    dynamic: false

servicos:
  consulta-isbn:
    url: ${CONSULTA_ISBN_URL:http://localhost:8081}

spring.cloud.openfeign.client.config.consultaIsbnClient:
  connectTimeout: ${CONSULTA_ISBN_CONNECT_TIMEOUT:3000}
  readTimeout: ${CONSULTA_ISBN_READ_TIMEOUT:5000}

resiliencia:
  consulta-isbn:
    max-tentativas: ${CONSULTA_ISBN_MAX_TENTATIVAS:3}
    intervalo-ms: ${CONSULTA_ISBN_INTERVALO_RETRY_MS:250}

mensageria:
  publicacao-habilitada: false
  exchange: biblioteca.reservas
  filas:
    reserva-solicitada: biblioteca.reserva-solicitada
  routing-keys:
    reserva-solicitada: reserva.solicitada

batch:
  importacao-livros:
    arquivo: ${IMPORTACAO_LIVROS_ARQUIVO:./dados/livros.csv}
    tamanho-chunk: ${IMPORTACAO_LIVROS_CHUNK:10}

aplicacao:
  cors:
    origens-permitidas: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: false
