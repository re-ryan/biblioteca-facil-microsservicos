spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:bibliotecafacil;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  rabbitmq:
    listener:
      simple:
        auto-startup: false

servicos:
  consulta-isbn:
    url: http://localhost:8081

mensageria:
  publicacao-habilitada: false
  exchange: biblioteca.reservas
  filas:
    reserva-solicitada: biblioteca.reserva-solicitada
  routing-keys:
    reserva-solicitada: reserva.solicitada

batch:
  importacao-livros:
    arquivo: ./dados/livros.csv
    tamanho-chunk: 2
